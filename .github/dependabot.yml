version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      development:
        dependency-type: development
        exclude-patterns:
          - eslint-plugin-better-tailwindcss
          - es-html-parser-upstream
          - twig-lexer-upstream
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
